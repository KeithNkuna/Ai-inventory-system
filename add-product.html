<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Product - Cloud System</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --accent-green: #22c55e;
            --accent-red: #ef4444;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 16px;
        }
        .container {
            max-width: 700px;
            margin: 0 auto;
        }
        nav {
            display: flex;
            gap: 8px;
            background-color: var(--card-bg);
            padding: 10px;
            border-radius: 10px;
            margin-bottom: 20px;
            overflow-x: auto;
        }
        nav a {
            color: #94a3b8;
            text-decoration: none;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.9rem;
            font-weight: 500;
            white-space: nowrap;
        }
        nav a.active, nav a:hover {
            background-color: var(--primary);
            color: white;
        }
        h1 {
            font-size: 1.4rem;
            margin-bottom: 16px;
            color: #60a5fa;
        }
        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        h2 {
            font-size: 1.1rem;
            margin-top: 0;
            margin-bottom: 16px;
            border-bottom: 1px solid #334155;
            padding-bottom: 8px;
        }
        label {
            display: block;
            font-size: 0.85rem;
            color: #94a3b8;
            margin-bottom: 4px;
            font-weight: 500;
        }
        input {
            width: 100%;
            padding: 10px;
            margin-bottom: 14px;
            background-color: #0f172a;
            border: 1px solid #334155;
            border-radius: 6px;
            color: white;
            box-sizing: border-box;
            font-size: 0.95rem;
        }
        input:focus {
            outline: none;
            border-color: var(--primary);
        }
        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            margin-top: 8px;
        }
        button:hover {
            background-color: var(--primary-hover);
        }
        .status-msg {
            margin-top: 12px;
            padding: 10px;
            border-radius: 6px;
            font-size: 0.9rem;
            display: none;
        }
        .status-success {
            background-color: rgba(34, 197, 94, 0.2);
            color: var(--accent-green);
            border: 1px solid var(--accent-green);
        }
        .status-error {
            background-color: rgba(239, 68, 68, 0.2);
            color: var(--accent-red);
            border: 1px solid var(--accent-red);
        }
    </style>
</head>
<body>

<div class="container">
    <nav>
        <a href="index.html">📊 Dashboard</a>
        <a href="inventory.html">📦 Inventory</a>
        <a href="add-product.html" class="active">➕ Add Product</a>
        <a href="sales.html">🛒 Sales & Orders</a>
    </nav>

    <h1>Add New Inventory Item</h1>

    <div class="card">
        <h2>Product Specification Details</h2>
        
        <label>SKU Code</label>
        <input type="text" id="sku" placeholder="e.g. LAP-001">
        
        <label>Product Title</label>
        <input type="text" id="title" placeholder="e.g. Dell Latitude Laptop">
        
        <label>Initial Stock Quantity</label>
        <input type="number" id="stock" placeholder="50">
        
        <label>Safety Stock Threshold</label>
        <input type="number" id="safety" placeholder="10">
        
        <label>Cost Price (Unit Cost)</label>
        <input type="number" id="cost" placeholder="3500">
        
        <label>Selling Price (Retail Price)</label>
        <input type="number" id="selling" placeholder="5000">
        
        <button type="button" onclick="handleSave()">Save Product to Cloud Database</button>

        <div id="status-box" class="status-msg"></div>
    </div>
</div>

<script>
    const SUPABASE_URL = "https://ekllsezlqjmaycvzohwl.supabase.co";
    const SUPABASE_KEY = "sb_publishable_UQrFIk6HgLVwDckmfvrb9w_a35vjL5j";

    function showStatus(message, isError = false) {
        const box = document.getElementById("status-box");
        box.style.display = "block";
        box.className = `status-msg ${isError ? 'status-error' : 'status-success'}`;
        box.innerText = message;
    }

    async function handleSave() {
        const skuInput = document.getElementById("sku").value.trim();
        const titleInput = document.getElementById("title").value.trim();
        const stockInput = parseInt(document.getElementById("stock").value);
        const safetyInput = parseInt(document.getElementById("safety").value);
        const costInput = parseFloat(document.getElementById("cost").value);
        const sellingInput = parseFloat(document.getElementById("selling").value);

        if (!skuInput || !titleInput || isNaN(stockInput) || isNaN(safetyInput) || isNaN(costInput) || isNaN(sellingInput)) {
            showStatus("❌ Please fill in all fields with valid numbers and text.", true);
            return;
        }

        showStatus("Saving product to Supabase...");

        try {
            const response = await fetch(`${SUPABASE_URL}/rest/v1/products`, {
                method: "POST",
                headers: {
                    "apikey": SUPABASE_KEY,
                    "Authorization": `Bearer ${SUPABASE_KEY}`,
                    "Content-Type": "application/json",
                    "Prefer": "return=representation"
                },
                body: JSON.stringify({
                    sku: skuInput,
                    title: titleInput,
                    current_stock: stockInput,
                    safety_stock: safetyInput,
                    cost_price: costInput,
                    selling_price: sellingInput
                })
            });

            if (response.ok) {
                showStatus(`✅ Success! '${titleInput}' saved to cloud database.`);
                document.getElementById("sku").value = "";
                document.getElementById("title").value = "";
                document.getElementById("stock").value = "";
                document.getElementById("safety").value = "";
                document.getElementById("cost").value = "";
                document.getElementById("selling").value = "";
            } else {
                const errJson = await response.json();
                showStatus(`❌ Database Error: ${errJson.message || response.statusText}`, true);
            }
        } catch (err) {
            console.error(err);
            showStatus(`❌ Network Error: Could not connect to Supabase.`, true);
        }
    }
</script>

</body>
</html>
