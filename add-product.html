<script>
    const SUPABASE_URL = "https://ekllsezlqjmaycvzohwl.supabase.co";
    const SUPABASE_KEY = "sb_publishable_UQrFIk6HgLVwDckmfvrb9w_a35vjL5j";

    const headers = {
        "apikey": SUPABASE_KEY,
        "Authorization": `Bearer ${SUPABASE_KEY}`,
        "Content-Type": "application/json"
    };

    function showStatus(message, isError = false) {
        const box = document.getElementById("status-box");
        box.style.display = "block";
        box.className = `status-msg ${isError ? 'status-error' : 'status-success'}`;
        box.innerText = message;
    }

    async function addProduct() {
        try {
            const skuEl = document.getElementById("add-sku");
            const titleEl = document.getElementById("add-title");
            const stockEl = document.getElementById("add-stock");
            const safetyEl = document.getElementById("add-safety");
            const costEl = document.getElementById("add-cost");
            const sellingEl = document.getElementById("add-selling");

            if (!skuEl || !titleEl || !stockEl || !safetyEl || !costEl || !sellingEl) {
                alert("DOM elements missing!");
                return;
            }

            const sku = skuEl.value.trim();
            const title = titleEl.value.trim();
            const stock = parseInt(stockEl.value);
            const safety = parseInt(safetyEl.value);
            const cost = parseFloat(costEl.value);
            const selling = parseFloat(sellingEl.value);

            if (!sku || !title || isNaN(stock) || isNaN(safety) || isNaN(cost) || isNaN(selling)) {
                showStatus("❌ Please fill in all required fields with valid values.", true);
                return;
            }

            const payload = {
                sku: sku,
                title: title,
                current_stock: stock,
                safety_stock: safety,
                cost_price: cost,
                selling_price: selling
            };

            showStatus("Saving item to cloud database...");

            const res = await fetch(`${SUPABASE_URL}/rest/v1/products`, {
                method: "POST",
                headers: { ...headers, "Prefer": "return=representation" },
                body: JSON.stringify(payload)
            });

            if (res.ok) {
                showStatus(`✅ Success! Product '${title}' (${sku}) added to database.`);
                skuEl.value = "";
                titleEl.value = "";
                stockEl.value = "";
                safetyEl.value = "";
                costEl.value = "";
                sellingEl.value = "";
            } else {
                const errData = await res.json();
                showStatus(`❌ Database Error: ${errData.message || 'Failed to insert row.'}`, true);
            }
        } catch (err) {
            console.error(err);
            showStatus(`❌ Error: ${err.message}`, true);
        }
    }
</script>
